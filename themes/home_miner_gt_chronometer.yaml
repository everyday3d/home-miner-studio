# ==============================================================================
# HOME MINER STUDIO — LUXURY AUTOMOTIVE INSTRUMENT CLUSTER THEME (themes.yaml)
# Aesthetic: Aston Martin / Porsche GT Chronometer Binnacle
# Features:
#   - Deep Carbon-Fiber Weave & Brushed Dark Titanium Dashboard Canvas
#   - Extruded Metallic Bezels (-1px -1px 2px specular highlight + 4px 4px 10px shadow)
#   - Recessed Dial Faces (inset 3px 3px 6px rgba(0,0,0,0.9))
#   - Curved Glass Lens Reflection (linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%))
#   - Condensed Automotive Typography (Chakra Petch / JetBrains Mono)
# ==============================================================================

Home Miner GT Chronometer:
  # Typography
  primary-font-family: "'Chakra Petch', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "'JetBrains Mono', monospace"
  ha-card-header-font-family: "'Chakra Petch', sans-serif"

  # Luxury Automotive Telemetry Accents (Ice-Blue Laser, Racing Redline, Emerald, Amber)
  primary-color: "#00e5ff"
  accent-color: "#ff2a4b"
  info-color: "#00e5ff"
  success-color: "#10b981"
  warning-color: "#f59e0b"
  error-color: "#ff2a4b"
  state-icon-color: "#94a3b8"
  state-icon-active-color: "#00e5ff"

  # Deep Carbon-Fiber Weave & Brushed Titanium Canvas with Ambient Vignetting
  primary-background-color: "#07090d"
  secondary-background-color: "#0c1017"
  lovelace-background: >-
    radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.08) 0%, transparent 55%),
    radial-gradient(circle at 50% 100%, rgba(0, 0, 0, 0.85) 0%, rgba(4, 6, 9, 0.95) 100%),
    repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.018) 0px, rgba(255, 255, 255, 0.018) 2px, transparent 2px, transparent 4px),
    repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.45) 0px, rgba(0, 0, 0, 0.45) 2px, transparent 2px, transparent 4px),
    linear-gradient(180deg, #0b0e14 0%, #06080c 100%)

  # Extruded Metallic Bezel Tokens & Recessed Gauge Tokens
  card-background-color: "#0e131b"
  ha-card-background: "linear-gradient(145deg, #1b2230 0%, #0d1118 55%, #151b26 100%)"
  ha-card-border-radius: "6px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(203, 213, 225, 0.25)"
  ha-card-box-shadow: "-1px -1px 2px rgba(255, 255, 255, 0.4), 4px 4px 10px rgba(0, 0, 0, 0.8), inset 1px 1px 1px rgba(255, 255, 255, 0.2)"

  # Reusable Custom CSS Variables for card-mod Skeuomorphic Layering
  gt-bezel-shadow: "-1px -1px 2px rgba(255, 255, 255, 0.4), 4px 4px 10px rgba(0, 0, 0, 0.8), inset 1px 1px 1px rgba(255, 255, 255, 0.2)"
  gt-recess-shadow: "inset 3px 3px 6px rgba(0, 0, 0, 0.9), inset -1px -1px 2px rgba(255, 255, 255, 0.08)"
  gt-lens-reflection: "linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 50%)"

  # High-Contrast Instrument Cluster Text Hierarchy
  primary-text-color: "#f8fafc"
  secondary-text-color: "#94a3b8"
  text-primary-color: "#f8fafc"
  disabled-text-color: "#475569"
  divider-color: "rgba(148, 163, 184, 0.16)"

  # Sidebar & App Header (Brushed Dark Titanium)
  app-header-background-color: "rgba(9, 12, 18, 0.92)"
  app-header-text-color: "#f8fafc"
  sidebar-background-color: "#080b10"
  sidebar-icon-color: "#64748b"
  sidebar-selected-icon-color: "#00e5ff"
  sidebar-selected-text-color: "#f8fafc"

  # Sliders, Switches & Interactive Controls
  paper-slider-knob-color: "#00e5ff"
  paper-slider-active-color: "#00e5ff"
  switch-checked-button-color: "#10b981"
  switch-checked-track-color: "rgba(16, 185, 129, 0.38)"

  # Global card-mod Theme Injection for Extruded Metallic Bezels & Curved Glass Lens
  card-mod-theme: "Home Miner GT Chronometer"
  card-mod-card-yaml: |
    .: |
      ha-card {
        background: linear-gradient(145deg, #1b2230 0%, #0d1118 55%, #151b26 100%) !important;
        border-radius: 6px !important;
        border: 1px solid rgba(203, 213, 225, 0.25) !important;
        box-shadow:
          -1px -1px 2px rgba(255, 255, 255, 0.4),
          4px 4px 10px rgba(0, 0, 0, 0.8),
          inset 1px 1px 1px rgba(255, 255, 255, 0.2) !important;
        position: relative !important;
        overflow: hidden !important;
        transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease !important;
      }
      ha-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 50%);
        pointer-events: none;
        z-index: 2;
      }
