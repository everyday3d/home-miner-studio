import_existing_miners:
  name: Import Existing Miners
  description: Automatically discover and import miners configured in other Home Assistant integrations or found on LAN.

apply_solar_curtailment:
  name: Apply Solar Curtailment
  description: Adjust miner profile or power state based on solar availability (eco, standard, turbo, pause).
  fields:
    mode:
      name: Curtailment Mode
      description: Curtailment profile to apply (eco, standard, turbo, pause).
      required: true
      example: eco
      selector:
        select:
          options:
            - eco
            - standard
            - turbo
            - pause
    host:
      name: Miner Host
      description: Optional IP or hostname of target miner (applies to all if omitted).
      required: false
      example: 192.168.1.91
      selector:
        text:

set_axeos_tuning:
  name: Set AxeOS Tuning
  description: Adjust Bitaxe / AxeOS clock frequency and core voltage.
  fields:
    frequency:
      name: Frequency (MHz)
      description: ASIC core frequency in MHz.
      required: true
      example: 500
      selector:
        number:
          min: 200
          max: 800
          unit_of_measurement: MHz
    core_voltage:
      name: Core Voltage (mV)
      description: ASIC core voltage in millivolts.
      required: true
      example: 1150
      selector:
        number:
          min: 900
          max: 1400
          unit_of_measurement: mV
    host:
      name: Miner Host
      description: Optional IP or hostname of target miner.
      required: false
      example: 192.168.1.91
      selector:
        text:

set_axeos_profile:
  name: Set AxeOS Profile
  description: Apply a preset performance profile to AxeOS miner.
  fields:
    profile:
      name: Profile
      description: Preset profile name (Eco, Standard, Turbo).
      required: true
      example: Eco
      selector:
        select:
          options:
            - Eco
            - Standard
            - Turbo
    host:
      name: Miner Host
      description: Optional IP or hostname of target miner.
      required: false
      example: 192.168.1.91
      selector:
        text:

reboot_miner:
  name: Reboot Miner
  description: Reboot miner hardware controller.
  fields:
    host:
      name: Miner Host
      description: Optional IP or hostname of target miner (reboots all if omitted).
      required: false
      example: 192.168.1.91
      selector:
        text:

restart_mining:
  name: Restart Mining
  description: Restart the miner hashing software process.
  fields:
    host:
      name: Miner Host
      description: Optional IP or hostname of target miner.
      required: false
      example: 192.168.1.91
      selector:
        text:

add_miner:
  name: Add Miner
  description: Register and configure a new cryptocurrency miner in Home Assistant.
  fields:
    host:
      name: Host / IP Address
      description: IP address or hostname of the miner.
      required: true
      example: 192.168.1.95
      selector:
        text:
    name:
      name: Friendly Name
      description: Name of the miner.
      required: false
      example: Living Room Bitaxe
      selector:
        text:
    miner_type:
      name: Miner Type
      description: Hardware type (bitaxe, cgminer_rpc, whatsminer, antminer, nerdminer, hiveos).
      required: false
      default: bitaxe
      selector:
        select:
          options:
            - bitaxe
            - cgminer_rpc
            - whatsminer
            - antminer
            - nerdminer
            - hiveos
    port:
      name: Port
      description: Management port (80 for Bitaxe/Nerdminer, 4028 for CGMiner/ASICs).
      required: false
      default: 80
      selector:
        number:
          min: 1
          max: 65535
    pool_provider:
      name: Mining Pool Provider
      description: Optional pool for worker telemetry tracking.
      required: false
      selector:
        select:
          options:
            - none
            - helios
            - mining_dutch
            - public_pool
            - 2miners
            - braiins
    pool_wallet:
      name: Pool Wallet / Worker
      description: Pool wallet address or username.
      required: false
      selector:
        text:

edit_miner:
  name: Edit Miner
  description: Update configuration parameters for an existing miner.
  fields:
    host:
      name: Miner Host
      description: IP address or hostname of the target miner.
      required: true
      example: 192.168.1.91
      selector:
        text:
    name:
      name: Friendly Name
      description: Updated friendly name.
      required: false
      selector:
        text:
    pool_provider:
      name: Mining Pool Provider
      description: Updated pool provider.
      required: false
      selector:
        select:
          options:
            - none
            - helios
            - mining_dutch
            - public_pool
            - 2miners
            - braiins
    pool_wallet:
      name: Pool Wallet / Worker
      description: Updated pool wallet address.
      required: false
      selector:
        text:

delete_miner:
  name: Delete Miner
  description: Remove a miner and its entities completely from Home Assistant.
  fields:
    host:
      name: Miner Host
      description: IP address or hostname of the miner to remove.
      required: true
      example: 192.168.1.91
      selector:
        text:
